name: paper dashboard

on:
  schedule:
    # 15 minutes after each 4-hour candle can close: 00:15, 04:15, 08:15, 12:15, 16:15, 20:15 UTC.
    # 4-hour strategies may trade each run. Daily strategies change only after the daily close.
    - cron: "15 */4 * * *"
    # GitHub often delays this cron by hours and then drops the next slot.
    # One hour later (01:15, 05:15, 09:15, 13:15, 17:15, 21:15 UTC) the same
    # closed bars are still the latest, so a missed slot is filled on the
    # next pass. The paper book is rebuilt from the whole series, so the
    # extra run does not double-count trades.
    - cron: "15 1,5,9,13,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Extend the paper book and rebuild the dashboard
        run: python scripts/update_lab.py
      - name: Commit the simulation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab.sqlite data/cache data/backtest_results.csv data/sweep_results.csv data/paper_trades.csv data/paper_positions.csv docs
          if git diff --staged --quiet; then
            echo "No change to commit"
          else
            git commit -m "Update paper book and dashboard"
            git push
          fi
