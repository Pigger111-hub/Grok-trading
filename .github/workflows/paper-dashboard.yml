name: paper dashboard

on:
  schedule:
    # Every 4 hours. Daily strategies only change after a candle closes;
    # a repeat run with no new candle still rewrites the same rows.
    - cron: "15 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Extend the paper book and rebuild the dashboard
        run: python scripts/update_lab.py
      - name: Commit the simulation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab.sqlite data/cache data/backtest_results.csv data/sweep_results.csv data/paper_trades.csv data/paper_positions.csv docs
          if git diff --staged --quiet; then
            echo "No change to commit"
          else
            git commit -m "Update paper book and dashboard"
            git push
          fi
